name: Run checks

on:
    push:
        branches-ignore:
            # ignore wiki-bot-update branches, because internal pull requests trigger both the on push and the on pull request event
            - wiki-bot-update-*
    pull_request:
        branches:
            - master

concurrency:
    # the event name keeps push and pull request runs from cancelling each other: a cancelled run
    # reports as `cancelled` rather than `success` and would block a pull request on a required check
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
    # never cancel on master, the deployment decision depends on those runs
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    test:
        name: test (${{ matrix.suite }})
        runs-on: ubuntu-latest
        strategy:
            # a red suite must not cancel the other one
            fail-fast: false
            matrix:
                include:
                    - suite: app
                      command: npm run test:ci
                    - suite: wiki-bot
                      command: npm run test:ci -w tools/wiki-bot
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Run tests
              run: ${{ matrix.command }}

    commitlint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  # we need the whole history to run commitlint correctly if multiple commit are pushed at the same time
                  fetch-depth: 0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Checkout master branch
              if: github.ref_name != 'master'
              run: git fetch origin master && git checkout master && git pull

            - name: Change back to triggered branch
              if: github.ref_name != 'master'
              run: git checkout ${{ github.ref_name }}

            - name: Run commitlint on push to master
              if: github.ref_name == 'master'
              run: npx --no -- commitlint --from ${{ github.event.before }} --verbose

            - name: Run commitlint on push to branch
              if: github.ref_name != 'master'
              run: npx --no -- commitlint --from refs/heads/master --verbose

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Run linters
              # keep going after a failing linter, so a single run surfaces every problem
              run: |
                  status=0
                  for script in eslint stylelint markdownlint; do
                    echo "::group::npm run $script"
                    npm run "$script" || status=1
                    echo "::endgroup::"
                  done
                  exit $status
